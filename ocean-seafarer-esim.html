            ]),

        h("div", { key:1, style:{display:"flex",alignItems:"center",gap:8,fontWeight:800} }, [h(Anchor,{key:1,size:16}), "OCEAN SEAFARER eSIM"]),
        h("div", { key:2, style:{fontSize:12,opacity:.5} },
          "© " + new Date().getFullYear() + " OCEAN Seafarer eSIM • Stay Connected at Sea. From Ship to Shore.")
      ])
    ),
  ]);
}
