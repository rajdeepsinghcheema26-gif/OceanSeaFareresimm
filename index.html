            h("div",{key:3,style:{marginTop:8,fontSize:13,lineHeight:1.6,color:"rgba(255,255,255,.6)"}}, s.d),
          ]))
        ),
        h("a", { key:3, href:waLink(), target:"_blank", rel:"noopener", className:"btn",
          style:{marginTop:24,height:44,background:"#fff",color:"var(--navy)",padding:"0 20px",fontSize:13.5} },
          "Start on WhatsApp — +91 75061 78946")
      ])
    ),

    /* FAQ */
    h("section", { key:"faq", style:{background:"#fff",borderTop:"1px solid rgba(0,0,0,.06)"} },
      h("div", { className:"wrap", style:{padding:"56px 20px",display:"grid",gridTemplateColumns:"1fr",gap:24} }, [
        h("h2", { key:1, style:{fontSize:26,fontWeight:800,letterSpacing:"-0.02em"} }, "Questions from crew at Jebel Ali, China, USA."),
        h("div", { key:2, style:{display:"flex",flexDirection:"column",gap:8} },
          FAQS.map((f,i) => h("div", { key:i, style:{
              borderRadius:16, border: openFaq===i ? "1px solid rgba(0,0,0,.1)" : "1px solid rgba(0,0,0,.06)",
              background: openFaq===i ? "var(--panel)" : "#fff"
            }}, [
            h("button", { key:1, onClick:()=>setOpenFaq(openFaq===i?null:i),
              style:{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:16,padding:20,textAlign:"left"} }, [
              h("div",{key:1,style:{fontSize:14.5,fontWeight:700,lineHeight:1.35}}, f.q),
              h("div",{key:2,style:{
                  width:28,height:28,borderRadius:999,border:"1px solid rgba(0,0,0,.1)",display:"flex",alignItems:"center",justifyContent:"center",
                  transform: openFaq===i ? "rotate(180deg)" : "none", transition:"transform .15s",
                  background: openFaq===i ? "var(--navy)" : "#fff", color: openFaq===i ? "#fff" : "var(--navy)"
                }}, h(ChevronDown,{size:16}))
            ]),
            openFaq===i ? h("div",{key:2,style:{padding:"0 20px 20px",marginTop:-4,fontSize:13.5,lineHeight:1.7,opacity:.65}}, f.a) : null
          ]))
        )
      ])
    ),

    /* FOOTER */
    h("footer", { key:"footer", style:{borderTop:"1px solid rgba(0,0,0,.06)",background:"#fff"} },
      h("div", { className:"wrap", style:{padding:"36px 20px",display:"flex",flexWrap:"wrap",justifyContent:"space-between",gap:16} }, [
        h("div", { key:1, style:{display:"flex",alignItems:"center",gap:8,fontWeight:800} }, [h(Anchor,{key:1,size:16}), "OCEAN SEAFARER eSIM"]),
        h("div", { key:2, style:{fontSize:12,opacity:.5} },
          "© " + new Date().getFullYear() + " OCEAN Seafarer eSIM • Stay Connected at Sea. From Ship to Shore.")
      ])
    ),
  ]);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(React.StrictMode, null, h(App)));
</script>
